<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Orpheus: the Android orb, the desktop hotkey client or any OpenAI-compatible client sends audio to your own server, which decodes it, transcribes it with Parakeet TDT, applies a spoken-symbol pre-pass and an optional LLM cleanup, and returns the text"><rect width="1200" height="340" rx="16" fill="#ffffff" stroke="#d0d7de"/><rect x="60" y="60.0" width="6" height="12" rx="3" fill="#6e56cf"/><rect x="68" y="54.0" width="6" height="24" rx="3" fill="#6e56cf"/><rect x="76" y="46.0" width="6" height="40" rx="3" fill="#8b75e0"/><rect x="84" y="54.0" width="6" height="24" rx="3" fill="#6e56cf"/><rect x="92" y="60.0" width="6" height="12" rx="3" fill="#6e56cf"/><text x="112" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="38" font-weight="700" fill="#1f2328">orpheus</text><text x="60" y="114" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">Speak on your phone or desktop. Your own server transcribes and tidies it. The text lands at the cursor.</text><text x="60" y="166" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">clients</text><rect x="60" y="178" width="210" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="74" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">Android orb</text><rect x="60" y="226" width="210" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="74" y="250.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">desktop hotkey</text><rect x="60" y="274" width="210" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="74" y="298.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">any OpenAI STT client</text><rect x="330" y="150" width="810" height="168" rx="12" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="2 4"/><text x="350" y="176" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">your server · <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#1f2328">POST /v1/audio/transcriptions</tspan></text><rect x="351.0" y="194" width="177" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="439.5" y="223" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">decode</text><text x="439.5" y="244" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">ffmpeg → 16 kHz mono</text><rect x="548.0" y="194" width="177" height="68" rx="10" fill="#f6f8fa" stroke="#6e56cf" stroke-width="1.5"/><text x="636.5" y="223" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Parakeet TDT</text><text x="636.5" y="244" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">NeMo speech-to-text</text><line x1="528.0" y1="228.0" x2="541.0" y2="228.0" stroke="#656d76" stroke-width="1.8"/><path d="M540.0,233.0 L548.0,228.0 L540.0,223.0 Z" fill="#656d76"/><rect x="745.0" y="194" width="177" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="833.5" y="223" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">pre-pass</text><text x="833.5" y="244" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">spoken symbols, lists</text><line x1="725.0" y1="228.0" x2="738.0" y2="228.0" stroke="#656d76" stroke-width="1.8"/><path d="M737.0,233.0 L745.0,228.0 L737.0,223.0 Z" fill="#656d76"/><rect x="942.0" y="194" width="177" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1030.5" y="223" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">LLM cleanup</text><text x="1030.5" y="244" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">optional, any chat API</text><line x1="922.0" y1="228.0" x2="935.0" y2="228.0" stroke="#656d76" stroke-width="1.8"/><path d="M934.0,233.0 L942.0,228.0 L934.0,223.0 Z" fill="#656d76"/><text x="350" y="300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">If the cleanup drops words or the endpoint is down, the pre-pass text comes back instead.</text><line x1="270" y1="197" x2="342.5" y2="225.4" stroke="#656d76" stroke-width="1.8"/><path d="M339.7,229.7 L349.0,228.0 L343.4,220.4 Z" fill="#656d76"/><line x1="270" y1="245" x2="342.2" y2="229.5" stroke="#656d76" stroke-width="1.8"/><path d="M342.2,234.6 L349.0,228.0 L340.1,224.8 Z" fill="#656d76"/><line x1="270" y1="293" x2="343.6" y2="232.4" stroke="#656d76" stroke-width="1.8"/><path d="M346.0,236.9 L349.0,228.0 L339.6,229.2 Z" fill="#656d76"/></svg>